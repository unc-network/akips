name: Code Quality and Testing
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main, develop ]
  # Called by release.yml so a publish is gated on the full matrix passing.
  # This is why push above no longer lists main: pushes to main reach these
  # same jobs through the release workflow instead of running them twice.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linters:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Install poetry
      run: |
        pipx install poetry

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'poetry'

    - name: Install dependencies
      run: |
        poetry install

    - name: Run ruff
      run: |
        poetry run ruff check .

    - name: Run black
      run: |
        poetry run black --check .

    # The package ships a py.typed marker, so its annotations are a promise to
    # anyone type checking against it.  This is what keeps that promise honest.
    - name: Run mypy
      run: |
        poetry run mypy

  pytest:
    name: Std Test on Python ${{ matrix.python-version }} (${{ matrix.platform}})
    needs: linters
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
        platform: [ubuntu-24.04, windows-2025]
        # The package has no OS-specific code, so Windows only covers the
        # oldest and newest Python instead of every version. Keeping a Windows
        # leg at all is what would catch a pytz to zoneinfo move, since
        # zoneinfo has no tz database there without the tzdata package.
        exclude:
          - { platform: windows-2025, python-version: '3.11' }
          - { platform: windows-2025, python-version: '3.12' }
          - { platform: windows-2025, python-version: '3.13' }

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install poetry
        run: |
          pipx install poetry

      - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.platform }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: 'poetry'

      - name: Install dependencies
        run: |
          poetry install

      - name: Run Tests
        run: |
          poetry run pytest -v tests
