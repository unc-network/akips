# This workflow will install Python dependencies, run tests and lint with a single version of Python

name: CI
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  linters:
    runs-on: ubuntu-24.04
    environment: prod

    env:
      PACKAGE_PATH: "./${{ vars.PACKAGE_NAME }}"

    steps:
    - uses: actions/checkout@v4

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install poetry
      run: |
        pipx install poetry

    - name: Set up Python 
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'poetry'

    - name: Install dependencies
      run: |
        poetry install

    # - name: Install Poetry
    #   uses: snok/install-poetry@v1
    #   with:
    #     virtualenvs-create: true
    #     virtualenvs-in-project: true

    # - name: Cache Poetry virtualenv
    #   uses: actions/cache@v4
    #   id: cached-poetry-dependencies
    #   with:
    #     path: .venv
    #     key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

    # - name: Install Dependencies
    #   run: poetry install
    #   if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'

    - name: Run pylama
      run: |
        poetry run pylama .

    - name: Run black
      run: |
        poetry run black --check .

    # - name: Run mypy
    #   run: |
    #     poetry run mypy --version
    #     poetry run mypy ./akips/

  pytest:
    name: Std Test on Python ${{ matrix.python-version }} (${{ matrix.platform}})
    needs: linters
    if: needs.linters.result == 'success'
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        python-version: [ '3.9', '3.10', '3.11', "3.12", "3.13" ]
        platform: [ubuntu-24.04, windows-2022]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup python ${{ matrix.python-version }} on ${{ matrix.platform }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - uses: actions/checkout@v4

      - name: Install poetry
        run: |
          pipx install poetry

      - name: Set up Python ${{ matrix.python-version }}  on ${{ matrix.platform }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'poetry'

      - name: Install dependencies
        run: |
          poetry install

      - name: Run Tests
        run: |
          poetry run pytest -v tests
