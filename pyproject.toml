[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "akips"
version = "0.6.0.dev2"
description = "Module to interact with the AKiPS Network Monitoring Software API interface"
authors = ["William E Whitaker <will.whitaker@unc.edu>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/unc-network/akips"
classifiers = [
        "License :: OSI Approved :: MIT License",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
requests = ">=2.31"
pytz = "*"

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
pytest = "^9.0.3"
ruff = "^0.16.1"
pdoc = "^16.0.0"

[tool.ruff]
# Matches the line length the old pylama pycodestyle config allowed
line-length = 128

[tool.ruff.lint]
# pycodestyle (E, W) and pyflakes (F), the linters pylama was configured with.
# Its third, mccabe, only contributes C901, which that config already ignored.
# S is flake8-bandit, which ports bandit's checks, so the security lint runs
# in the same pass rather than as a separate tool.
select = ["E", "W", "F", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert; that is the point of them.
"tests/*" = ["S101"]

[tool.black]
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
    | akips_setup
    | docs
)/
'''